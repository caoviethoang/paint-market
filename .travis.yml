language: ruby
rvm:
  - 3.2.2

services:
  - postgresql

addons:
  postgresql: "13"

before_script:
  - cp config/database.yml.travis config/database.yml
  - bundle exec rails db:create
  - bundle exec rails db:schema:load

script:
  - bundle exec rspec

cache:
  bundler: true
  directories:
    - node_modules
